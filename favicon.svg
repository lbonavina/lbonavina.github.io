<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="orb1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1f"/>
      <stop offset="50%" stop-color="#0d1535"/>
      <stop offset="100%" stop-color="#0a1425"/>
    </linearGradient>
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="dotglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!-- Orbs -->
  <rect width="256" height="256" rx="56" ry="56" fill="url(#orb1)" clip-path="url(#rounded)"/>
  <rect width="256" height="256" rx="56" ry="56" fill="url(#orb2)" clip-path="url(#rounded)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="55" ry="55"
        fill="none" stroke="#60a5fa" stroke-opacity="0.28" stroke-width="2"/>

  <!-- LB text -->
  <text x="128" y="158"
        font-family="'Funnel Display', 'Liberation Sans', Arial, sans-serif"
        font-weight="800" font-size="108"
        text-anchor="middle"
        fill="url(#textgrad)">LB</text>

  <!-- Green dot glow -->
  <circle cx="204" cy="52" r="18" fill="url(#dotglow)"/>
  <!-- Green dot -->
  <circle cx="204" cy="52" r="9" fill="#34d399"/>
  <circle cx="204" cy="52" r="5" fill="#6ee7b7"/>
</svg>
